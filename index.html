<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>irwan_saputra.quotes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root[data-theme="light"] {
    --bg: #F0F0EE;
    --text: #18181B;
    --text-muted: #8A8A85;
    --accent: #15803D;
    --shadow: rgba(20, 20, 15, 0.06);
    --toggle-bg: #E5E5E5;
    --toggle-border: #D4D4D4;
  }
  :root[data-theme="dark"] {
    --bg: #0B0C0A;
    --text: #E9E9E5;
    --text-muted: #7C7D77;
    --accent: #4ADE80;
    --shadow: rgba(0, 0, 0, 0.35);
    --toggle-bg: #262626;
    --toggle-border: #333333;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    min-height: 100vh;
  }

  body {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center; /* Vertically center */
    padding: 28px 14px 60px;
    transition: background 0.25s ease, color 0.25s ease;
    position: relative;
  }

  .toggle {
    display: flex;
    align-items: center;
    background: var(--toggle-bg);
    border: 1px solid var(--toggle-border);
    border-radius: 20px;
    padding: 2px;
    cursor: pointer;
    position: absolute;
    top: 20px;
    right: 20px;
  }

  .toggle button {
    all: unset;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    font-size: 14px;
    cursor: pointer;
    color: var(--text-muted);
    transition: background 0.2s ease, color 0.2s ease;
  }

  .toggle button.active {
    background: var(--bg);
    color: var(--text);
    box-shadow: 0 2px 4px var(--shadow);
  }

  .quote-row {
    display: flex;
    align-items: center;
    justify-content: center; /* Horizontally center */
    padding: 20px 13px;
    min-height: 128px;
    width: 100%;
    max-width: 420px;
  }

  .quote-slot {
    opacity: 1;
    transform: translateY(0);
    transition: opacity 0.55s ease, transform 0.55s ease;
    text-align: center; /* Center text */
  }

  .quote-slot.fade {
    opacity: 0;
    transform: translateY(4px);
  }

  .quote-text {
    font-size: 16px; /* Slightly larger for better readability */
    line-height: 1.6;
  }

  .quote-text .mark { color: var(--accent); }

  .quote-author {
    display: block;
    margin-top: 12px;
    font-size: 13px; /* Slightly larger for better readability */
    color: var(--text-muted);
  }

  .quote-author .name { color: var(--accent); }

</style>
</head>
<body>
  <div class="toggle" id="themeToggle">
    <button id="darkBtn" aria-label="Dark mode">☾</button>
    <button id="lightBtn" class="active" aria-label="Light mode">☀</button>
  </div>

  <div class="quote-row">
    <div class="quote-slot" id="quoteSlot">
      <div class="quote-text"><span class="mark">"</span>Content is king.<span class="mark">"</span></div>
      <span class="quote-author">— <span class="name">Bill Gates</span></span>
    </div>
  </div>

<script>
  const root = document.documentElement;
  const lightBtn = document.getElementById('lightBtn');
  const darkBtn = document.getElementById('darkBtn');

  function setTheme(theme) {
    root.setAttribute('data-theme', theme);
    lightBtn.classList.toggle('active', theme === 'light');
    darkBtn.classList.toggle('active', theme === 'dark');
    localStorage.setItem('theme', theme);
  }

  const saved = localStorage.getItem('theme');
  if (saved) setTheme(saved);

  lightBtn.addEventListener('click', () => setTheme('light'));
  darkBtn.addEventListener('click', () => setTheme('dark'));

  const quotes = [
    { text: 'Content is king.', author: 'Bill Gates' },
    { text: "People don't buy what you do; they buy why you do it.", author: 'Simon Sinek' },
    { text: "The consumer isn't a moron; she is your wife.", author: 'David Ogilvy' },
    { text: "Your brand is what people say about you when you're not in the room.", author: 'Jeff Bezos' },
    { text: 'Word of mouth is the best medium of all.', author: 'Bill Bernbach' },
    { text: "The best marketing doesn't feel like marketing.", author: 'Tom Fishburne' },
    { text: "Marketing is a contest for people's attention.", author: 'Seth Godin' },
    { text: 'A brand is a voice, and a product is a souvenir.', author: 'Lisa Gansky' }
  ];

  const slot = document.getElementById('quoteSlot');

  let idx = 0;

  function render(i) {
    const q = quotes[i];
    slot.innerHTML =
      '<div class="quote-text"><span class="mark">&quot;</span>' + q.text +
      '<span class="mark">&quot;</span></div>' +
      '<span class="quote-author">— <span class="name">' + q.author + '</span></span>';
  }

  function next() {
    slot.classList.add('fade');
    setTimeout(() => {
      idx = (idx + 1) % quotes.length;
      render(idx);
      slot.classList.remove('fade');
    }, 550);
  }

  setInterval(next, 4200);
</script>
</body>
</html>
