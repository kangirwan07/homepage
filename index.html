<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>irwan_saputra.quotes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root[data-theme="light"] {
    --bg: #F0F0EE;
    --window: #FFFFFF;
    --border: #E3E3E0;
    --text: #18181B;
    --text-muted: #8A8A85;
    --accent: #15803D;
    --accent-soft: #E8F3EB;
    --chrome-red: #FF5F57;
    --chrome-yellow: #FEBC2E;
    --chrome-green: #28C840;
    --shadow: rgba(20, 20, 15, 0.06);
  }
  :root[data-theme="dark"] {
    --bg: #0B0C0A;
    --window: #131412;
    --border: #262723;
    --text: #E9E9E5;
    --text-muted: #7C7D77;
    --accent: #4ADE80;
    --accent-soft: #16281D;
    --chrome-red: #FF5F57;
    --chrome-yellow: #FEBC2E;
    --chrome-green: #28C840;
    --shadow: rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    min-height: 100vh;
  }

  body {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 28px 14px 60px;
    transition: background 0.25s ease, color 0.25s ease;
  }

  .frame {
    width: 100%;
    max-width: 420px;
  }

  .window {
    background: var(--window);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 8px 30px var(--shadow);
    overflow: hidden;
  }

  .titlebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }

  .dots { display: flex; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.red { background: var(--chrome-red); }
  .dot.yellow { background: var(--chrome-yellow); }
  .dot.green { background: var(--chrome-green); }

  .filename {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.01em;
  }

  .toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px;
    cursor: pointer;
  }

  .toggle button {
    all: unset;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    font-size: 12px;
    cursor: pointer;
    color: var(--text-muted);
  }

  .toggle button.active {
    background: var(--window);
    color: var(--accent);
  }

  .content { padding: 22px 18px 20px; }

  .hero {
    margin-bottom: 20px;
  }

  .hero h1 {
    font-size: 21px;
    line-height: 1.35;
    margin: 0 0 6px;
    font-weight: 600;
  }

  .cursor {
    display: inline-block;
    width: 9px;
    height: 18px;
    background: var(--accent);
    margin-left: 2px;
    vertical-align: -3px;
    animation: blink 1.1s step-start infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  .hero p {
    font-size: 12.5px;
    color: var(--text-muted);
    margin: 0;
  }

  .hero p .accent { color: var(--accent); }

  .panel {
    background: var(--window);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 14px;
  }

  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 13px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }

  .panel-head span:first-child {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.02em;
  }

  .panel-head span.readonly {
    font-size: 9.5px;
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 6px;
  }

  .quote-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px 13px;
    min-height: 128px;
  }

  .lineno {
    color: var(--text-muted);
    font-size: 12px;
    opacity: 0.6;
    padding-top: 1px;
    min-width: 16px;
    transition: opacity 0.4s ease;
  }

  .quote-slot {
    opacity: 1;
    transform: translateY(0);
    transition: opacity 0.55s ease, transform 0.55s ease;
  }

  .quote-slot.fade {
    opacity: 0;
    transform: translateY(4px);
  }

  .quote-text {
    font-size: 13.5px;
    line-height: 1.55;
  }

  .quote-text .mark { color: var(--accent); }

  .quote-author {
    display: block;
    margin-top: 7px;
    font-size: 11.5px;
    color: var(--text-muted);
  }

  .quote-author .name { color: var(--accent); }

  .dots-progress {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 4px 13px 16px;
  }

  .dots-progress span {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--border);
    transition: background 0.4s ease, transform 0.4s ease;
  }

  .dots-progress span.on {
    background: var(--accent);
    transform: scale(1.4);
  }

  .footer {
    text-align: center;
    margin-top: 24px;
  }

  .footer a {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text);
    text-decoration: none;
    border: 1px solid var(--border);
    background: var(--window);
    padding: 9px 16px;
    border-radius: 8px;
  }

  .footer a .arrow { color: var(--accent); }

  .footer .sig {
    display: block;
    margin-top: 14px;
    font-size: 10.5px;
    color: var(--text-muted);
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="window">
      <div class="titlebar">
        <div class="dots">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
        </div>
        <span class="filename">quotes.log</span>
        <div class="toggle" id="themeToggle">
          <button id="lightBtn" class="active" aria-label="Light mode">☀</button>
          <button id="darkBtn" aria-label="Dark mode">☾</button>
        </div>
      </div>

      <div class="content">
        <div class="hero">
          <h1>Words worth keeping close<span class="cursor"></span></h1>
          <p>curated by <span class="accent">Irwan Saputra</span> — digital marketing specialist, Jakarta</p>
        </div>

        <div class="panel">
          <div class="panel-head">
            <span>// QUOTES.LOG</span>
            <span class="readonly">READ-ONLY</span>
          </div>

          <div class="quote-row">
            <span class="lineno" id="lineno">01</span>
            <div class="quote-slot" id="quoteSlot">
              <div class="quote-text"><span class="mark">"</span>Content is king.<span class="mark">"</span></div>
              <span class="quote-author">— <span class="name">Bill Gates</span></span>
            </div>
          </div>

          <div class="dots-progress" id="dotsProgress"></div>
        </div>

        <div class="footer">
          <a href="/resume"><span class="arrow">→</span> read the full resume</a>
          <span class="sig">irwansaputra.my.id</span>
        </div>
      </div>
    </div>
  </div>

<script>
  const root = document.documentElement;
  const lightBtn = document.getElementById('lightBtn');
  const darkBtn = document.getElementById('darkBtn');

  function setTheme(theme) {
    root.setAttribute('data-theme', theme);
    lightBtn.classList.toggle('active', theme === 'light');
    darkBtn.classList.toggle('active', theme === 'dark');
    localStorage.setItem('theme', theme);
  }

  const saved = localStorage.getItem('theme');
  if (saved) setTheme(saved);

  lightBtn.addEventListener('click', () => setTheme('light'));
  darkBtn.addEventListener('click', () => setTheme('dark'));

  const quotes = [
    { text: 'Content is king.', author: 'Bill Gates' },
    { text: "People don't buy what you do; they buy why you do it.", author: 'Simon Sinek' },
    { text: "The consumer isn't a moron; she is your wife.", author: 'David Ogilvy' },
    { text: "Your brand is what people say about you when you're not in the room.", author: 'Jeff Bezos' },
    { text: 'Word of mouth is the best medium of all.', author: 'Bill Bernbach' },
    { text: "The best marketing doesn't feel like marketing.", author: 'Tom Fishburne' },
    { text: "Marketing is a contest for people's attention.", author: 'Seth Godin' },
    { text: 'A brand is a voice, and a product is a souvenir.', author: 'Lisa Gansky' }
  ];

  const slot = document.getElementById('quoteSlot');
  const lineno = document.getElementById('lineno');
  const dotsWrap = document.getElementById('dotsProgress');

  quotes.forEach((_, i) => {
    const dot = document.createElement('span');
    if (i === 0) dot.classList.add('on');
    dotsWrap.appendChild(dot);
  });

  let idx = 0;

  function render(i) {
    const q = quotes[i];
    slot.innerHTML =
      '<div class="quote-text"><span class="mark">&quot;</span>' + q.text +
      '<span class="mark">&quot;</span></div>' +
      '<span class="quote-author">— <span class="name">' + q.author + '</span></span>';
    lineno.textContent = String(i + 1).padStart(2, '0');
    [...dotsWrap.children].forEach((d, di) => d.classList.toggle('on', di === i));
  }

  function next() {
    slot.classList.add('fade');
    lineno.style.opacity = '0';
    setTimeout(() => {
      idx = (idx + 1) % quotes.length;
      render(idx);
      slot.classList.remove('fade');
      lineno.style.opacity = '0.6';
    }, 550);
  }

  setInterval(next, 4200);
</script>
</body>
</html>
