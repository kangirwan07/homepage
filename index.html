<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>irwan_saputra.quotes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root[data-theme="light"] {
    --bg: #F0F0EE;
    --text: #18181B;
    --text-muted: #8A8A85;
    --accent: #15803D;
    --shadow: rgba(20, 20, 15, 0.06);
    --toggle-bg: #E5E5E5;
    --toggle-border: #D4D4D4;
  }
  :root[data-theme="dark"] {
    --bg: #0B0C0A;
    --text: #E9E9E5;
    --text-muted: #7C7D77;
    --accent: #4ADE80;
    --shadow: rgba(0, 0, 0, 0.35);
    --toggle-bg: #262626;
    --toggle-border: #333333;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center; /* Vertically center content */
  }

  body {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    color: var(--text);
    padding: 20px;
    transition: background 0.25s ease, color 0.25s ease;
    position: relative; /* For absolute positioning of the toggle */
    width: 100%;
  }

  .toggle-container {
    position: absolute;
    top: 24px;
    right: 24px;
    display: flex;
    align-items: center;
    background: var(--toggle-bg);
    border: 1px solid var(--toggle-border);
    border-radius: 20px; /* Pill shape */
    padding: 3px;
    gap: 2px;
  }

  .toggle-container button {
    all: unset;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    cursor: pointer;
    color: var(--text-muted);
    transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
  }

  .toggle-container button svg {
    width: 16px;
    height: 16px;
  }

  .toggle-container button.active {
    background: var(--bg);
    color: var(--accent);
    box-shadow: 0 1px 3px var(--shadow);
  }

  .quote-container {
    width: 100%;
    max-width: 500px; /* Wider max-width for just the quote */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 160px; /* Ensure space for longer quotes */
  }

  .quote-slot {
    opacity: 1;
    transform: translateY(0);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  .quote-slot.fade {
    opacity: 0;
    transform: translateY(10px);
  }

  .quote-text {
    font-size: 18px; /* Larger font size for emphasis */
    line-height: 1.6;
    margin-bottom: 16px;
    font-weight: 500;
  }

  .quote-text .mark { 
    color: var(--accent); 
    font-weight: 700;
  }

  .quote-author {
    display: block;
    font-size: 14px;
    color: var(--text-muted);
  }

  .quote-author .name { 
    color: var(--accent);
    font-weight: 600;
  }

</style>
</head>
<body>
  
  <div class="toggle-container" id="themeToggle" role="group" aria-label="Theme toggle">
    <button type="button" id="darkBtn" aria-label="Dark mode">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button type="button" id="lightBtn" class="active" aria-label="Light mode">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8"/></svg>
    </button>
  </div>

  <div class="quote-container">
    <div class="quote-slot" id="quoteSlot">
      <!-- Initial Quote to prevent layout shift on load -->
      <div class="quote-text"><span class="mark">"</span>Content is king.<span class="mark">"</span></div>
      <span class="quote-author">— <span class="name">Bill Gates</span></span>
    </div>
  </div>

<script>
  const root = document.documentElement;
  const lightBtn = document.getElementById('lightBtn');
  const darkBtn = document.getElementById('darkBtn');

  function setTheme(theme) {
    root.setAttribute('data-theme', theme);
    lightBtn.classList.toggle('active', theme === 'light');
    darkBtn.classList.toggle('active', theme === 'dark');
    localStorage.setItem('theme', theme);
  }

  const saved = localStorage.getItem('theme');
  if (saved) setTheme(saved);

  lightBtn.addEventListener('click', () => setTheme('light'));
  darkBtn.addEventListener('click', () => setTheme('dark'));

  const quotes = [
    { text: 'Content is king.', author: 'Bill Gates' },
    { text: "People don't buy what you do; they buy why you do it.", author: 'Simon Sinek' },
    { text: "The consumer isn't a moron; she is your wife.", author: 'David Ogilvy' },
    { text: "Your brand is what people say about you when you're not in the room.", author: 'Jeff Bezos' },
    { text: 'Word of mouth is the best medium of all.', author: 'Bill Bernbach' },
    { text: "The best marketing doesn't feel like marketing.", author: 'Tom Fishburne' },
    { text: "Marketing is a contest for people's attention.", author: 'Seth Godin' },
    { text: 'A brand is a voice, and a product is a souvenir.', author: 'Lisa Gansky' }
  ];

  const slot = document.getElementById('quoteSlot');

  let idx = 0;

  function render(i) {
    const q = quotes[i];
    slot.innerHTML =
      '<div class="quote-text"><span class="mark">&quot;</span>' + q.text +
      '<span class="mark">&quot;</span></div>' +
      '<span class="quote-author">— <span class="name">' + q.author + '</span></span>';
  }

  function next() {
    slot.classList.add('fade');
    setTimeout(() => {
      idx = (idx + 1) % quotes.length;
      render(idx);
      slot.classList.remove('fade');
    }, 550);
  }

  setInterval(next, 4200);
</script>
</body>
</html>
